<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ខោអាវអនឡាញទាន់សម័យ</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Kantumruuy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">SMART<span class="text-black">SHOP</span></a>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fas fa-shopping-bag text-2xl text-gray-700 hover:text-blue-600"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
            </div>
        </div>
    </nav>

    <!-- Products Grid -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <h2 class="text-2xl font-bold text-center mb-8 border-b-2 border-blue-600 w-48 mx-auto pb-2">ផលិតផលថ្មីៗ</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- អាវទី១ -->
            <div class="bg-white rounded-lg shadow p-4 flex flex-col justify-between">
                <img src="https://unsplash.com" class="w-full h-48 object-cover rounded-md mb-4">
                <div>
                    <h3 class="font-semibold text-base mb-1">អាវយឺតដៃខ្លីសាមញ្ញ</h3>
                    <p class="text-blue-600 font-bold mb-3">\$10.00</p>
                </div>
                <button onclick="addToCart('អាវយឺតដៃខ្លីសាមញ្ញ', 10.00)" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-blue-600 transition text-sm">ថែមចូលកន្ត្រក</button>
            </div>

            <!-- អាវទី២ -->
            <div class="bg-white rounded-lg shadow p-4 flex flex-col justify-between">
                <img src="https://unsplash.com" class="w-full h-48 object-cover rounded-md mb-4">
                <div>
                    <h3 class="font-semibold text-base mb-1">អាវសាច់ក្រណាត់បុរស</h3>
                    <p class="text-blue-600 font-bold mb-3">\$15.50</p>
                </div>
                <button onclick="addToCart('អាវសាច់ក្រណាត់បុរស', 15.50)" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-blue-600 transition text-sm">ថែមចូលកន្ត្រក</button>
            </div>

            <!-- អាវទី៣ -->
            <div class="bg-white rounded-lg shadow p-4 flex flex-col justify-between">
                <img src="https://unsplash.com" class="w-full h-48 object-cover rounded-md mb-4">
                <div>
                    <h3 class="font-semibold text-base mb-1">អាវរងា Hoodie ក្រាស់</h3>
                    <p class="text-blue-600 font-bold mb-3">\$22.00</p>
                </div>
                <button onclick="addToCart('អាវរងា Hoodie ក្រាស់', 22.00)" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-blue-600 transition text-sm">ថែមចូលកន្ត្រក</button>
            </div>

            <!-- អាវទី៤ -->
            <div class="bg-white rounded-lg shadow p-4 flex flex-col justify-between">
                <img src="https://unsplash.com" class="w-full h-48 object-cover rounded-md mb-4">
                <div>
                    <h3 class="font-semibold text-base mb-1">រ៉ូបនារីម៉ូដទាន់សម័យ</h3>
                    <p class="text-blue-600 font-bold mb-3">\$18.00</p>
                </div>
                <button onclick="addToCart('រ៉ូបនារីម៉ូដទាន់សម័យ', 18.00)" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-blue-600 transition text-sm">ថែមចូលកន្ត្រក</button>
            </div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="text-xl font-bold">កន្ត្រកទំនិញ</h3>
                <i onclick="toggleCart()" class="fas fa-times text-xl cursor-pointer hover:text-blue-600"></i>
            </div>
            <div id="cart-items" class="space-y-4 overflow-y-auto max-h-[60vh]">
                <p class="text-gray-500 text-center py-4">មិនទាន់មានទំនិញ</p>
            </div>
        </div>
        <div class="border-t pt-4">
            <div class="flex justify-between font-bold text-lg mb-4">
                <span>សរុប៖</span>
                <span id="cart-total" class="text-blue-600">\$0.00</span>
            </div>
            <button onclick="openCheckoutModal()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">បន្តទៅការកុម្ម៉ង់</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">ព័ត៌មានសម្រាប់ដឹកជញ្ជូន</h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium mb-1">ឈ្មោះអ្នកទិញ *</label>
                    <input type="text" id="cust-name" class="w-full border p-2 rounded" placeholder="ឧទាហរណ៍៖ សុខ ចាន់">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">លេខទូរស័ព្ទ *</label>
                    <input type="text" id="cust-phone" class="w-full border p-2 rounded" placeholder="ឧទាហរណ៍៖ 096XXXXXXX">
                </div>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeCheckoutModal()" class="w-1/2 bg-gray-200 py-2 rounded font-medium">បោះបង់</button>
                <button onclick="sendOrderToTelegram()" class="w-1/2 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">បញ្ជាក់ការទិញ</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        
        // កំណត់ Token និង Chat ID របស់ Telegram នៅទីនេះ
        const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN';
        const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID';

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('translate-x-full'); }
        function openCheckoutModal() { if(cart.length===0){alert('សូមរើសទំនិញមុន!'); return;} document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        function addToCart(name, price) { cart.push({name, price}); updateCartUI(); }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            if(cart.length === 0) { container.innerHTML = '<p class="text-gray-500 text-center py-4">មិនទាន់មានទំនិញ</p>'; document.getElementById('cart-total').innerText = '\$0.00'; return; }
            let html = '', total = 0;
            cart.forEach((item, i) => { total += item.price; html += `<div class="flex justify-between items-center border-b pb-2"><div><h4 class="text-sm font-medium">${item.name}</h4><p class="text-blue-600 text-xs">$${item.price.toFixed(2)}</p></div><i onclick="cart.splice(${i},1);updateCartUI();" class="fas fa-trash text-gray-400 hover:text-red-500 cursor-pointer text-xs"></i></div>`; });
            container.innerHTML = html;
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function sendOrderToTelegram() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            if(!name || !phone) { alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់!'); return; }

            let itemText = '';
            let total = 0;
            cart.forEach(item => { itemText += `- ${item.name} ($${item.price})\n`; total += item.price; });

            const message = `🛍️ **មានការកុម្ម៉ង់ថ្មី!**\n\n👤 ឈ្មោះ៖ ${name}\n📞 ទូរស័ព្ទ៖ ${phone}\n\n📦 មុខទំនិញ៖\n${itemText}\n💰 សរុប៖ $${total.toFixed(2)}`;

            const url = `https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            })
            .then(res => {
                alert('ការកុម្ម៉ង់បានជោគជ័យ! សារបានផ្ញើទៅកាន់ប្រព័ន្ធគ្រប់គ្រងរបស់អ្នកហើយ។');
                cart = []; updateCartUI(); closeCheckoutModal(); toggleCart();
            })
            .catch(err => alert('មានបញ្ហាក្នុងការផ្ញើសារ។ សូមពិនិត្យមើល Bot Token ម្តងទៀត!'));
        }
    </script>
</body>
</html>
